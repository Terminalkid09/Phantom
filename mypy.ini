; mypy — the repository type gate (see .github/workflows/ci.yml, job
; `static-analysis`). Run it locally with:
;
;     pip install -r requirements-dev.txt
;     python -m mypy            # uses `files` below
;     python -m mypy phantom    # the tree-wide number, for the burn-down
;
; SCOPE IS A RATCHET. The tree-wide run reports 376 errors in 93 of 335
; modules (measured when the gate was added, mypy 2.2), so gating on all of
; it today would be a red build nobody can fix in one commit. The gate covers
; the modules that ARE clean and grows by ADDING A DIRECTORY here — a
; directory, not a file list, so a new file inside it is covered
; automatically (the same rule the test job follows: glob, never a
; hand-maintained list). Never remove a directory to make a run pass.
;
; `follow_imports = silent` is what makes the scope real: imported modules are
; still analysed for types (so annotations here are checked against their real
; signatures), but their own pre-existing errors are not reported — only the
; modules listed in `files` decide the verdict.
;
; Seeded with the phase-contract layer: 25 modules, 0 errors. It is the
; migration target of auto-mode, so it is where an undetected signature drift
; (the `ReportWriter(out_dir)` kind) costs the most.
[mypy]
python_version = 3.10
files = phantom/automation/phases
follow_imports = silent
ignore_missing_imports = True
warn_redundant_casts = True
warn_unused_ignores = True

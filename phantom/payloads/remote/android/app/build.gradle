plugins {
    id 'com.android.application'
}

android {
    namespace 'com.phantom.remote'
    compileSdk 34

    defaultConfig {
        applicationId "com.phantom.remote"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -O2 -fvisibility=hidden"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/jni/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    // The remote module is a foothold tool, not a Play app: keep the merged
    // manifest exactly as declared (no analytics/permissions added).
    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

dependencies {
}

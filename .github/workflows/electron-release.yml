name: Electron Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build, for example v3.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  backend:
    name: Build Python backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-backend
          - os: macos-latest
            artifact: macos-backend
          - os: ubuntu-latest
            artifact: linux-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller==6.21.0

      # onedir (not onefile): the onefile bootloader is a well-known AV
      # heuristic trigger (false positives on Windows Defender / McAfee).
      - name: Build backend executable
        run: |
          python -m PyInstaller --clean --noconfirm phantom/api/phantom-backend-onedir.spec

      # Upload the onedir tree as-is. The artifact service packages it, and
      # download-artifact extracts it straight into electron/backend, which is
      # the layout electron-builder's extraResources expects.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/phantom-backend
          if-no-files-found: error

  electron:
    name: Build Electron installer (${{ matrix.os }})
    needs: backend
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            backend-artifact: windows-backend
            backend-file: phantom-backend.exe
            npm-script: electron:build
          - os: macos-latest
            backend-artifact: macos-backend
            backend-file: phantom-backend
            npm-script: electron:build
          - os: ubuntu-latest
            backend-artifact: linux-backend
            backend-file: phantom-backend
            npm-script: electron:build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Install frontend dependencies
        working-directory: electron
        run: npm ci

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.backend-artifact }}
          path: electron/backend

      - name: Make backend executable
        if: runner.os != 'Windows'
        run: chmod +x electron/backend/${{ matrix.backend-file }}

      - name: Build and package Electron
        working-directory: electron
        run: npm run ${{ matrix.npm-script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Do not upload win-unpacked/ or builder-debug.yml: only the three
      # installer families belong on the public release.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phantom-${{ runner.os }}-installer
          path: |
            electron/dist-release/*.exe
            electron/dist-release/*.dmg
            electron/dist-release/*.AppImage
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: phantom-*-installer
          path: release-assets
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches the packaged version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os

          tag = os.environ["RELEASE_TAG"]
          version = json.load(open("electron/package.json", encoding="utf-8"))["version"]
          if tag.removeprefix("v") != version:
              raise SystemExit(
                  f"release tag {tag!r} does not match electron/package.json {version!r}"
              )
          print(f"tag {tag} matches package version {version}")
          PY

      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create release and upload installers
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**

name: Phantom CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      # fail-fast off: with three interpreters, a failure on one used to CANCEL
      # the other two, so a red run told you nothing about whether the problem
      # was version-specific. Three verdicts cost runner minutes and save
      # whole debugging sessions.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # P0-11: one pinned dev set for the whole suite (pytest + plugins +
          # pyyaml + bandit). No ad-hoc pip lines in later steps.
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run linting (py_compile all sources)
        run: |
          python -m py_compile phantom/core/*.py phantom/modules/*.py phantom/utils/*.py \
            phantom/automation/*.py phantom/automation/guidance/*.py \
            phantom/automation/exploit/*.py phantom/automation/exploit/modules/*.py \
            phantom/automation/social/*.py phantom/automation/fingerprint/*.py \
            phantom/api/*.py
          if [ $? -ne 0 ]; then exit 1; fi

      - name: Run unit tests (whole suite — glob collected)
        run: |
          set -o pipefail
          # P0-12: glob collection, not a hand-maintained list. The old
          # explicit TEST_FILES block silently skipped every NEW test file;
          # collection now tracks the directory itself. The two standalone
          # integration scripts are EXCLUDED here (their module body compiles
          # a real beacon and sys.exit()s at import — collect_ignore cannot
          # save an explicitly-passed file from being imported).
          TEST_FILES=$(ls tests/test_*.py | sort \
            | grep -v -e 'tests/test_features_final.py' -e 'tests/test_real_deploy.py' \
            | tr '\n' ' ')
          echo "Collected ${#TEST_FILES} test files (glob)"
          [ -n "$TEST_FILES" ] || { echo "ERROR: no test files found"; exit 1; }
          # `tail`, never `head`: with pipefail a truncated pipe sends SIGPIPE to
          # pytest and fails the step even when every test passed. `--maxfail`
          # instead of `-x` so one flake does not hide the rest of the run.
          # HERMETIC gate: tool-dependent tests are deselected and run in the
          # separate `integration-tools` job below, so a missing binary never
          # masquerades as a product regression here.
          python -m pytest $TEST_FILES -m "not integration_tool" -v --timeout=120 --maxfail=25 2>&1 \
            | tee /tmp/pytest.out | tail -200

      - name: Surface the failing tests as annotations
        # A red run used to be diagnosable only by whoever could open the job
        # logs. The failing test IDs are emitted as ANNOTATIONS instead, which
        # the Checks UI shows and the public API returns without a login — so
        # "CI is red" carries the test that broke with it. Diagnostic only:
        # this step never changes the verdict of the run (it is `if: failure()`
        # and its own commands cannot fail the job).
        if: failure()
        run: |
          echo "::warning title=pytest::the unit-test step failed - see the annotations below for the failing tests"
          if [ -f /tmp/pytest.out ]; then
            # EVERY failure, not the first ten: a run with `--maxfail=25` was
            # emitting ten annotations and hiding the rest, so fixing what you
            # could see revealed another batch. The annotations are the only
            # channel that survives without admin rights on the job log.
            total=$(grep -cE '^(FAILED|ERROR) ' /tmp/pytest.out || true)
            echo "::error title=pytest::${total} failing test(s) - all of them are annotated below"
            grep -E '^(FAILED|ERROR) ' /tmp/pytest.out | head -50 | while read -r line; do
              echo "::error title=pytest::${line}"
            done
            echo "--- short summary ---"
            sed -n '/short test summary info/,$p' /tmp/pytest.out | head -60
          else
            echo "::error title=pytest::no pytest output captured (the step failed before running the suite)"
          fi

      - name: Verify the product assets are TRACKED, not just present
        # The failure this step exists for: `phantom/data/` used to be ignored
        # as a whole, so the report template existed on every developer's disk
        # and in no clone. The report tests passed locally, the unit-test step
        # failed on CI for months, and fourteen other jobs were skipped behind
        # it. A fresh clone is the only place that difference is visible.
        run: |
          tracked=$(git ls-files phantom/data/templates)
          [ -n "$tracked" ] || {
            echo "::error title=assets::report templates are NOT tracked in git"
            exit 1
          }
          echo "tracked assets: $tracked"
          # Same bug class, second instance: the `*.xml` document rule hid the
          # Android module's manifest, accessibility config and res/values, so
          # only the .java files survived a clone and the Android tree tests
          # failed there with FileNotFoundError.
          android_xml=$(git ls-files phantom/payloads/remote/android/app/src/main \
            | grep '\.xml$' || true)
          [ -n "$android_xml" ] || {
            echo "::error title=assets::the Android module's XML (manifest / accessibility config) is NOT tracked"
            exit 1
          }
          echo "tracked android xml: $android_xml"

      - name: Verify core module imports
        run: |
          python -c "
          from phantom.core.workflow import WorkflowManager, workflow_manager
          from phantom.core.persistence import persistence_manager, PersistenceManager
          from phantom.core.automode import run_auto_mode
          from phantom.modules.wordlist import WordlistModule
          print('All core modules imported successfully')
          print(f'Workflow phases: {len(workflow_manager.phases)} target types')
          print(f'Persistence rules: {len(persistence_manager.rules)} rules')
          "

      - name: Verify enterprise + automation module imports
        run: |
          python -c "
          from phantom.core.threatintel import threat_intel, ThreatIntelFeed
          from phantom.core.calibration import calibration_engine, CalibrationEngine
          from phantom.core.attack_mapping import attack_mapper, AttackMapper
          from phantom.core.risk_engine import risk_engine, RiskEngine
          from phantom.core.history import history_analyzer, HistoricalAnalyzer
          from phantom.automation.fingerprint.probes import FingerprintEngine, PROBE_MAP
          from phantom.automation.attack_chain import AttackGraph
          from phantom.automation.exploit.differential import DifferentialEngine
          from phantom.automation.ad_awareness import ADAwareness
          from phantom.automation.fallback import FallbackEngine, HistoricalLearner
          print('All enterprise + automation modules imported successfully')
          # smoke counts: verify the mappers still expose real data, using the
          # CURRENT accessors (a rename here is a real breakage worth catching)
          techniques = attack_mapper.get_enterprise_techniques()
          assert techniques, 'ATT&CK mapper returned no techniques'
          print(f'ATT&CK techniques: {len(techniques)}')
          print(f'Risk service types: {len(risk_engine.business_criticality)}')
          print(f'Protocol probes: {len(PROBE_MAP)}')
          "

  electron-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & typecheck + build Electron
        run: |
          cd electron
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build

  c2-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: C2, auth, state-store and UX tests
        run: |
          python -m pytest tests/test_c2*.py tests/test_beacon_auth*.py tests/test_state_store.py tests/test_manual_ux.py tests/test_manual_core.py -v --timeout=60
      - name: End-to-end C2 <-> beacon protocol smoke
        # starts the REAL listener and drives check-in -> task -> replay ->
        # result over HTTP with the real HMAC auth and envelope crypto. This
        # is the interface a compiled beacon speaks to — the break nothing
        # else on this runner sees.
        run: python scripts/e2e_c2_beacon_smoke.py

  beacon-syntax:
    runs-on: ${{ matrix.os }}
    needs: lint-and-test
    strategy:
      # fail-fast off for the same reason as the unit-test matrix: with three
      # operating systems, a macOS failure CANCELED the Windows leg, so a red
      # run said nothing about whether the break was platform-specific.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ toolchain and OpenSSL headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y g++ libssl-dev
      - name: Install MinGW
        if: runner.os == 'Windows'
        shell: powershell
        run: choco install mingw -y --no-progress
      - name: Install OpenSSL headers on macOS
        if: runner.os == 'macOS'
        run: brew install openssl@3
      - name: Set up Python (the generators need it)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps (header generators import Phantom)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: Generate the REAL build headers (never a hand-written stub)
        # The same generators the release build uses: a drift in a generated
        # header — a renamed macro, a malformed array, a new required define —
        # then fails HERE instead of only on an operator's machine.
        shell: bash
        run: |
          python scripts/ci_beacon_prepare.py --dir phantom/payloads/beacon --ci-identity
          python scripts/ci_beacon_prepare.py --dir phantom/payloads/remote --ci-identity
      - name: Compile beacon AND remote translation units (warnings are errors)
        shell: bash
        run: |
          set -o pipefail
          # -Werror on a CURATED set: the WinAPI noise (`#pragma comment`,
          # partial Win32 struct init, FARPROC casts) is suppressed, every
          # other warning fails the job. Linux and Windows were verified
          # warning-free with exactly these flags; macOS also tolerates an
          # unknown warning option so a clang version skew cannot break it.
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            CXX=clang++
            CPPFLAGS="-I$(brew --prefix openssl@3)/include"
            WARNS="-Wall -Wextra -Werror -Wno-unknown-pragmas -Wno-missing-field-initializers -Wno-cast-function-type -Wno-unknown-warning-option"
          else
            CXX=g++
            CPPFLAGS=""
            WARNS="-Wall -Wextra -Werror -Wno-unknown-pragmas -Wno-missing-field-initializers -Wno-cast-function-type"
          fi
          # The remote module carries its OWN copy of crypto.h and the
          # transport: exactly the kind of duplication that drifts silently.
          {
            $CXX -std=c++20 -fsyntax-only $WARNS $CPPFLAGS -Iphantom/payloads/beacon/src phantom/payloads/beacon/src/main.cpp
            $CXX -std=c++20 -fsyntax-only $WARNS $CPPFLAGS -Iphantom/payloads/remote/src phantom/payloads/remote/src/main.cpp
          } 2>&1 | tee /tmp/beacon.out

      - name: Surface the compiler error as an annotation
        # Diagnostic only (see the unit-test step): the job log needs admin,
        # annotations are public, and this job compiles on three platforms.
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/beacon.out ]; then
            tail -30 /tmp/beacon.out | while IFS= read -r line; do
              echo "::error title=beacon-syntax::${line}"
            done
          else
            echo "::error title=beacon-syntax::no compiler output captured"
          fi

  beacon-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps and C++ toolchain
        run: |
          set -o pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          # The packages the BUILDER refuses to build without, taken from the
          # static-dependency map `check_build_env` checks — not a hand-kept
          # list. That list had half of them, and this job failed on the
          # missing third-party static archives (libcurl/brotli/nghttp2) with
          # "Build environment not ready for linux (x64)" before compiling a
          # single line: on a runner there is no container auto-install to
          # fill the gap.
          PKGS=$(python -c "from phantom.utils.build_helper import _LINUX_STATIC_DEPS as m; print(' '.join(sorted(set(m.values()))))")
          echo "builder-required packages: $PKGS"
          sudo apt-get update && sudo apt-get install -y g++ $PKGS
      - name: Compile the beacon through the RELEASE path
        # tee'd so the failure can be annotated (see the step below).
        # the real build function the release uses, not a hand-rolled
        # command: a break in the generated headers, the flags or the link
        # fails here instead of at an engagement. The canary token is set so
        # the NEXT step can prove it never reaches the binary.
        env:
          PHANTOM_PAYLOAD_TOKEN: phantom-canary-deployment-token
        run: |
          set -o pipefail
          python scripts/ci_beacon_smoke.py --platform linux --require 2>&1 \
            | tee /tmp/beacon.out

      - name: Surface the build failure as an annotation
        # Diagnostic only: the job log needs admin rights, annotations do not.
        if: failure()
        run: |
          if [ -f /tmp/beacon.out ]; then
            tail -25 /tmp/beacon.out | while IFS= read -r line; do
              echo "::error title=beacon-smoke::${line}"
            done
          else
            echo "::error title=beacon-smoke::no build output captured"
          fi

      - name: The built binary carries no deployment payload token
        # An enrolled build derives its own download token at runtime; if the
        # deployment-wide token ever leaks in, one captured beacon unlocks
        # every payload, forever.
        run: |
          python scripts/ci_beacon_token_scan.py \
            --artefact phantom/payloads/beacon/beacon_linux \
            --token phantom-canary-deployment-token

  beacon-smoke-windows:
    # A Windows build is NOT a variant of the Linux one: it uses BCrypt
    # instead of OpenSSL, GNU as for the stub/syscall objects and a different
    # linker shape. It has to be built here or it is never built.
    runs-on: windows-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MinGW (g++ AND as)
        shell: powershell
        run: choco install mingw -y --no-progress
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: Compile the beacon for Windows (release path)
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_beacon_smoke.py --platform windows --require 2>&1 \
            | tee /tmp/beacon.out

      - name: Surface the build failure as an annotation
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/beacon.out ]; then
            tail -25 /tmp/beacon.out | while IFS= read -r line; do
              echo "::error title=beacon-smoke-windows::${line}"
            done
          else
            echo "::error title=beacon-smoke-windows::no build output captured"
          fi

  beacon-smoke-macos:
    # Native clang++ on a real Mac: osxcross only exists to cross-compile FROM
    # Linux, and demanding it on macOS made the platform unbuildable there.
    runs-on: macos-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install OpenSSL (Homebrew's is keg-only)
        run: brew install openssl@3
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: Compile the beacon for macOS (release path)
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci_beacon_smoke.py --platform macos --require 2>&1 \
            | tee /tmp/beacon.out

      - name: Surface the build failure as an annotation
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/beacon.out ]; then
            tail -25 /tmp/beacon.out | while IFS= read -r line; do
              echo "::error title=beacon-smoke-macos::${line}"
            done
          else
            echo "::error title=beacon-smoke-macos::no build output captured"
          fi

  beacon-smoke-android:
    # The NDK does not ship OpenSSL; the build helper cross-compiles it into
    # the NDK sysroot on first use. That is exactly what runs here, so a real
    # aarch64 payload is produced — an honest failure if any link of that
    # chain breaks.
    runs-on: ubuntu-latest
    needs: lint-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps and build tools (OpenSSL bootstrap needs them)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
          sudo apt-get update && sudo apt-get install -y build-essential perl
      - name: Compile the beacon for Android (release path)
        shell: bash
        run: |
          # The runner image ships an NDK under ANDROID_NDK_LATEST_HOME; the
          # other names are honoured too, exactly like the builder does.
          set -o pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-/opt/android-ndk}}"
          echo "NDK: $ANDROID_NDK_HOME"
          python scripts/ci_beacon_smoke.py --platform android --require 2>&1 \
            | tee /tmp/beacon.out

      - name: Surface the build failure as an annotation
        if: failure()
        shell: bash
        run: |
          if [ -f /tmp/beacon.out ]; then
            tail -25 /tmp/beacon.out | while IFS= read -r line; do
              echo "::error title=beacon-smoke-android::${line}"
            done
          else
            echo "::error title=beacon-smoke-android::no build output captured"
          fi

  c2d-test:
    # The Go data plane is a SECOND implementation of the wire protocol. It is
    # only honest to ship it if CI proves it builds, vets and agrees with the
    # Python side on the key derivation.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r requirements.txt
      - name: gofmt / vet / test
        working-directory: c2d
        run: |
          set -o pipefail
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then echo "ERROR: gofmt needed for:"; echo "$UNFORMATTED"; exit 1; fi
          go vet ./...
          go test ./... -v 2>&1 | tail -40
      - name: Python <-> Go key derivation parity
        run: python scripts/c2d_parity_check.py

  beacon-lint:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Beacon source hygiene
        # Not a file-existence check: required units, `#pragma once`, generated
        # headers NOT tracked, no committed build artefacts, no debug prints,
        # no deployment secret in tracked source.
        run: python scripts/ci_beacon_lint.py

  security-scan:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Run bandit security scan (blocking on unbaselined HIGH)
        run: |
          pip install bandit
          # .bandit holds the reviewed, accepted-by-design HIGH checks; any
          # OTHER high-severity finding now FAILS the job (it used to only
          # warn, so a real regression could merge unseen).
          #
          # Coverage now includes the helper scripts and the Electron tree:
          # scripts/ is REAL Python that was previously unscanned, and bandit
          # skips non-Python files, so `electron/` only ever contributes a
          # stray .py if one appears. The .bandit baseline covers both.
          bandit -r phantom/ scripts/ electron/ -c .bandit -f json -o bandit-results.json || true
          python -c "
          import json
          with open('bandit-results.json') as f:
              data = json.load(f)
          high = [r for r in data.get('results', []) if r.get('issue_severity') == 'HIGH']
          if high:
              print(f'FAIL: {len(high)} high-severity issue(s) outside the .bandit baseline')
              for r in high[:10]:
                  print(f'  - {r[\"test_id\"]}: {r[\"issue_text\"]} @ {r[\"filename\"]}:{r[\"line_number\"]}')
              raise SystemExit(1)
          print('No unbaselined high-severity issues found')
          "

  offline-sims:
    # The two offline coverage simulators are the project's own answer to
    # "does the planner have a move for this target?" — and nothing ever ran
    # them in CI, so a planner/registry rename could silently break the very
    # diagnostic meant to catch it. Both are fully offline (scripted runner,
    # no packet leaves the box).
    #
    # Honest framing: these are SIMULATIONS, not gates. Both `main()`s return
    # 0 by design even when the matrix reports a coverage GAP, so a green step
    # means "the script still runs end-to-end", not "coverage improved". A
    # crash (import error, planner API break) does fail the step.
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Offline coverage simulations (non-gating — they report, not assert)
        run: |
          python scripts/coverage_matrix_sim.py
          python scripts/hardened_target_sim.py

  integration-tools:
    runs-on: ubuntu-latest
    needs: lint-and-test
    # External-tool tests are NOT hermetic: they need nmap and may fail for
    # environment reasons. Kept separate (and non-blocking) so a missing
    # binary never blocks a merge nor masquerades as a product regression —
    # the hermetic job above is the required gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies + external tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          sudo apt-get update && sudo apt-get install -y nmap
      - name: Run integration-tool tests
        run: |
          set -o pipefail
          python -m pytest tests/ -m "integration_tool" -v --timeout=120 2>&1 | tail -100

  security-sweep:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Security invariant tests
        run: |
          set -o pipefail
          # Glob, not a hand-maintained list: a NEW security test file has to
          # run here without anyone remembering to add it. The hermetic job
          # had the same bug (P0-12) and was fixed the same way; the old
          # explicit list here silently skipped every security test added
          # after it was written.
          SECURITY_TESTS=$(ls tests/test_security*.py tests/test_p0_*.py \
            tests/test_c2_token_rotation.py tests/test_remote_viewer.py \
            tests/test_config_secret_perms.py \
            tests/test_electron_allowlist_sync.py tests/test_endpoint_allowlist_drift.py \
            2>/dev/null | sort -u | tr '\n' ' ')
          echo "Security sweep files: $SECURITY_TESTS"
          [ -n "$SECURITY_TESTS" ] || { echo "ERROR: no security tests found"; exit 1; }
          # `not integration_tool`: these files contain end-to-end execution
          # asserts that need a real native/WSL2/SSH backend. Without the
          # filter they fail on a runner that has none and the sweep reads as
          # a product regression instead of an environment gap.
          python -m pytest $SECURITY_TESTS -m "not integration_tool" \
            -v --timeout=120 2>&1 | tail -100

  docker-test:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile syntax
        run: |
          if [ -f "Dockerfile" ]; then
            docker run --rm -v $(pwd):/src -w /src alpine/shfmt --check . 2>/dev/null || true
            echo "Dockerfile exists and checked"
          fi
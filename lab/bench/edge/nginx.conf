# The edge proxy: a normal-looking front end in front of the app.
#
# It hides the framework (X-Powered-By is stripped) and forwards /api and / to
# the Flask app, so the surface a scanner sees is "nginx" and the SQLi is one
# proxy hop away.
server {
    listen 80;
    server_name _;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

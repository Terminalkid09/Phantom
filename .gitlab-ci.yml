stages:
  - test
  - build

variables:
  DOCKER_IMAGE: phantom-framework

# ── Unit Tests ────────────────────────────────────────────────────────────
unit_tests:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - pytest tests/ -v
  tags:
    - docker

# ── Build: Windows Beacon (via MinGW cross-compile) ───────────────────────
build_windows:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq g++-mingw-w64-x86-64 > /dev/null
  script:
    - cd phantom/payloads/beacon
    - x86_64-w64-mingw32-g++ -std=c++17 -O2 -s -o beacon.exe src/main.cpp
      -lwinhttp -lbcrypt -lws2_32 -static
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon.exe
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - docker

# ── Build: Linux Beacon ──────────────────────────────────────────────────
build_linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq g++ libcurl4-openssl-dev libssl-dev > /dev/null
  script:
    - cd phantom/payloads/beacon
    - g++ -std=c++17 -O2 -s -o beacon_linux src/main.cpp
      -lcurl -lssl -lcrypto -lpthread
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon_linux
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - docker

# ── Build: macOS Beacon (requires macOS runner) ─────────────────────────
build_macos:
  stage: build
  script:
    - cd phantom/payloads/beacon
    - clang++ -std=c++17 -O2 -o beacon_macos src/main.cpp
      -lcurl -lssl -lcrypto -lpthread -framework CoreGraphics
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon_macos
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - macos
  allow_failure: true

# ── Build: Android Beacon (ARM64 via NDK) ────────────────────────────────
build_android:
  stage: build
  image: thyrlian/android-sdk:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip > /dev/null
  script:
    - export NDK_HOME=${ANDROID_HOME}/ndk-bundle
    - export CC=${NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang++
    - cd phantom/payloads/beacon
    - ${CC} -std=c++17 -O2 -s -o beacon_android src/main.cpp -static
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon_android
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - docker
  allow_failure: true

# ── Docker Build ─────────────────────────────────────────────────────────
docker_build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE .
  only:
    - main
  tags:
    - docker

stages:
  - test
  - build

variables:
  DOCKER_IMAGE: phantom-framework
  BEACON_DIR: phantom/payloads/beacon

# ── Unit Tests ────────────────────────────────────────────────────────────
unit_tests:
  stage: test
  image: python:3.10
  script:
    - pip install -r requirements.txt
    - pip install pytest pytest-asyncio pytest-cov
    - pip install -e .
    - pytest tests/ -v --tb=short --cov=phantom --cov-report=term --cov-report=xml
  coverage: '/TOTAL.*\d+%$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  tags:
    - docker

# Shared anchor: generate crypto_config.h from env / defaults
.beacon_crypto: &beacon_crypto
  - python3 scripts/ci_beacon_prepare.py

# ── Build: Windows Beacon (via MinGW cross-compile) ───────────────────────
build_windows:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 python3 > /dev/null
  script:
    - *beacon_crypto
    - cd ${BEACON_DIR}
    - for asm in syscalls pic_bootstrap peb_walker api_resolver stack_spoofer; do
        x86_64-w64-mingw32-as src/${asm}.asm -o src/${asm}.o;
      done
    - x86_64-w64-mingw32-g++ -std=c++20 -O2 -s -Isrc -o beacon.exe src/main.cpp
      src/syscalls.o src/pic_bootstrap.o src/peb_walker.o src/api_resolver.o src/stack_spoofer.o
      -lwinhttp -lbcrypt -lws2_32 -lbthprops -lwlanapi -liphlpapi -lcrypt32 -static
    - x86_64-w64-mingw32-objcopy -O binary beacon.exe beacon.bin 2>/dev/null || echo "objcopy not available, .bin skipped"
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon.exe
      - phantom/payloads/beacon/beacon.bin
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - docker

# ── Build: Linux Beacon ──────────────────────────────────────────────────
build_linux:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq g++ libcurl4-openssl-dev libssl-dev python3 > /dev/null
  script:
    - *beacon_crypto
    - cd ${BEACON_DIR}
    - g++ -std=c++20 -O2 -s -Isrc -o beacon_linux src/main.cpp
      -lcurl -lssl -lcrypto -lpthread
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon_linux
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - docker

# ── Build: macOS Beacon (requires macOS runner) ─────────────────────────
build_macos:
  stage: build
  before_script:
    - python3 scripts/ci_beacon_prepare.py
  script:
    - cd ${BEACON_DIR}
    - clang++ -std=c++20 -O2 -Isrc -o beacon_macos src/main.cpp
      -lcurl -lssl -lcrypto -lpthread -framework CoreGraphics
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon_macos
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - macos
  allow_failure: true

# ── Build: Android Beacon (ARM64 via NDK) ────────────────────────────────
build_android:
  stage: build
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq && apt-get install -y -qq wget unzip python3 > /dev/null
    - |
      if [ ! -d /opt/android-ndk ]; then
        wget -q https://dl.google.com/android/repository/android-ndk-r26c-linux.zip -O /tmp/ndk.zip
        unzip -q /tmp/ndk.zip -d /opt
        mv /opt/android-ndk-r26c /opt/android-ndk
      fi
    - export ANDROID_NDK_HOME=/opt/android-ndk
  script:
    - *beacon_crypto
    - export ANDROID_NDK_HOME=/opt/android-ndk
    - export NDK_PREBUILT=${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64
    - export NDK_SYSROOT=${NDK_PREBUILT}/sysroot
    - export NDK_CC=${NDK_PREBUILT}/bin/aarch64-linux-android28-clang++
    - cd ${BEACON_DIR}
    - ${NDK_CC} -std=c++20 -O2 -s -Isrc -o beacon_android src/main.cpp
      --sysroot=${NDK_SYSROOT}
      -I${NDK_SYSROOT}/usr/include
      -L${NDK_SYSROOT}/usr/lib/aarch64-linux-android
      -static
  artifacts:
    paths:
      - phantom/payloads/beacon/beacon_android
    expire_in: 30 days
  only:
    - main
    - dev
  tags:
    - docker
  allow_failure: true

# ── Docker Build ─────────────────────────────────────────────────────────
docker_build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $DOCKER_IMAGE .
  only:
    - main
  tags:
    - docker

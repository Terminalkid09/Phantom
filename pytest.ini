[pytest]
# Only the tests/ tree is ours to collect. Without this, a bare `pytest`
# recurses into frozen build-output directories (electron/dist-release/...)
# and dies on duplicate test-module basenames from the packaged backend.
testpaths = tests
norecursedirs = dist dist-* build electron node_modules .git .pytest_cache
# tests/conftest.py holds collect_ignore (standalone integration scripts).
asyncio_mode = auto
markers =
    integration_tool: requires an external binary/toolchain (nmap, adb, a compiler); NOT hermetic, excluded from the unit-hermetic CI job
filterwarnings =
    ignore::DeprecationWarning
